[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facetrust-benchmark"
version = "0.2.0"
description = "Image deepfake detection and benchmark demo console."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pillow>=10.0",
  "pydantic>=2.7",
  "torch>=2.0",
  "torchvision>=0.16",
  "transformers>=4.42",
  "timm>=1.0.15",
  "safetensors>=0.4",
  "deepguard==0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
facetrust-benchmark = "facetrust_benchmark.web:main"
facetrust-detector = "facetrust_benchmark.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facetrust_benchmark = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
